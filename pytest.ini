[pytest]
testpaths = tests

# Шаблоны имен для файлов и функций с тестами
python_files = test_*.py
python_functions = test_*

# Дополнительные параметры запуска по умолчанию:
# -v (verbose) — подробный вывод (видно названия каждого теста)
# --strict-markers — запрещает использовать маркеры, которые не зарегистрированы
addopts = -v --strict-markers --ignore=backend/test_db.py

# Включаем вывод логов в консоль во время тестов (полезно для отладки)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S